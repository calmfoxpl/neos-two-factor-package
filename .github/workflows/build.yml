name: Build

on:
    push:
        branches: [main]
    pull_request: ~
    schedule:
        - cron: "0 3 * * 1" # every Monday, to catch upstream changes
    workflow_dispatch: ~

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    tests:
        name: "PHP ${{ matrix.php }}"
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php: ["8.2", "8.3", "8.4"]

        steps:
            - uses: actions/checkout@v5

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: intl, mbstring, json, dom, simplexml, sodium
                  tools: composer:v2, phpunit:11
                  coverage: none

            - name: Validate composer.json
              run: composer validate --strict --no-check-lock

            - name: Lint PHP
              run: find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l

            - name: Lint XLIFF
              run: |
                  for file in $(find Resources -name "*.xlf"); do
                      php -r 'libxml_use_internal_errors(true); $d = new DOMDocument(); if (!$d->load($argv[1])) { fwrite(STDERR, $argv[1] . " is not well formed\n"); exit(1); }' "$file"
                  done

            - name: Lint YAML
              run: |
                  for file in $(find Configuration -name "*.yaml"); do
                      ruby -e 'require "yaml"; YAML.load_file(ARGV[0])' "$file" || exit 1
                  done

            - name: Tests
              run: phpunit -c phpunit.xml.dist
